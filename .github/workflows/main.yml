name: Verify Human Identity
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Nama'
        required: true
        default: 'ahonmazino'
      agent_description:
        description: 'Deskripsi'
        required: true
        default: 'ahonmazino AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          cd scripts && npm install
      - name: Create Identity
        run: node scripts/createNewEthereumIdentity.js
      - name: Link Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_description }}"}'
          
